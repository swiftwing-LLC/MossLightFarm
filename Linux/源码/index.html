<div class="topbar"><div class="brand surface"><strong id="appName">苔光农场</strong><small>MOSSLIGHT · DESKTOP FARM</small></div><div class="wallet surface"><div><span class="coin">G</span><span class="money" id="coins">180</span></div><div class="level"><span id="level">Lv.1</span><div class="bar"><i id="xp" style="width:0%"></i></div></div><div class="weather-pill"><span id="weatherIcon">☀</span><span id="clock">—</span></div><button class="tiny" id="quickLang" title="Language / 语言">中/EN</button></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('world');let ctx=canvas.getContext('2d',{alpha:false});const SAVE='mosslight-farm-linux-v1';
const CROPS=[
 {id:'wheat',zh:'小麦',en:'Wheat',cost:3,price:2,seconds:300,level:1,xp:1,color:'#e8c661'},
 {id:'corn',zh:'玉米',en:'Corn',cost:8,price:4,seconds:600,level:2,xp:2,color:'#f0d56c'},
 {id:'carrot',zh:'胡萝卜',en:'Carrot',cost:12,price:6,seconds:1200,level:3,xp:3,color:'#e98a4c'},
 {id:'strawberry',zh:'草莓',en:'Strawberry',cost:24,price:10,seconds:3600,level:4,xp:4,color:'#d75c76'},
 {id:'potato',zh:'土豆',en:'Potato',cost:20,price:9,seconds:2400,level:5,xp:3,color:'#c1a17a'},
 {id:'tomato',zh:'西红柿',en:'Tomato',cost:32,price:14,seconds:5400,level:6,xp:5,color:'#d85d4c'},
 {id:'cotton',zh:'棉花',en:'Cotton',cost:42,price:18,seconds:7200,level:7,xp:6,color:'#f3ead4'},
 {id:'sugarcane',zh:'甘蔗',en:'Sugarcane',cost:54,price:24,seconds:10800,level:8,xp:8,color:'#91b96b'},
 {id:'pumpkin',zh:'南瓜',en:'Pumpkin',cost:70,price:32,seconds:14400,level:9,xp:10,color:'#db8545'}
];
const WORD={zh:{fields:'农田',warehouse:'仓库',workshop:'工坊',orders:'订单',build:'建造',settings:'设置',plant:'播种空地',harvest:'一键收菜',expand:'扩建农田',fieldsOpen:'块已开垦',fieldHint:'只显示已开垦土地。选择种子，再点击空田；收获后会放入仓库。',empty:'空地 · 播种',ripe:'可收获',growing:'生长中',paused:'建筑施工中，全农场暂停生产。',nothing:'暂时没有可收获的作物。',coins:'金币',level:'农场等级',choose:'选择种子',sell:'出售',sellAll:'全部出售',emptyStore:'仓库还空着，先种些作物吧。',make:'制作',queue:'生产队列',ready:'已完成',locked:'达到等级后开放',buildTitle:'建筑升级需要时间；施工期间全农场停产。',build:'建造',upgrade:'升级',constructing:'施工中',deliver:'交付订单',need:'材料还不够',complete:'工程完成',weather:'天气',day:'白昼',night:'夜晚',auto:'跟随时间',sunny:'晴朗',rainy:'下雨',snowy:'下雪',zoom:'界面大小',language:'语言',panHint:'拖动空地移动视野；拖动田块可以整理道路。',saved:'进度已保存',cash:'金币不足',noPlot:'这块田尚未开垦',noSeed:'请先选择已解锁的种子',confirm:'清除本机存档',clearWarn:'确定清除这台电脑上的农场存档吗？',expandLevel:'需要农场等级',readyAfter:'后成熟',minutes:'分钟',hours:'小时',worker:'施工队',pet:'团子',moveSaved:'田地位置已保存。',moveBlocked:'这里放不下，请避开道路与建筑。',time:'时间'},en:{fields:'Fields',warehouse:'Storage',workshop:'Workshop',orders:'Orders',build:'Build',settings:'Settings',plant:'Plant empty',harvest:'Harvest all',expand:'Expand land',fieldsOpen:'fields open',fieldHint:'Only unlocked fields are shown. Choose a seed, tap an empty plot, and harvest into storage.',empty:'Empty · plant',ripe:'Ready',growing:'Growing',paused:'Construction pauses all production.',nothing:'Nothing is ready to harvest.',coins:'Coins',level:'Farm level',choose:'Choose seed',sell:'Sell',sellAll:'Sell all',emptyStore:'Your storage is empty. Plant a few crops first.',make:'Make',queue:'Production queue',ready:'Ready',locked:'Unlock at a higher level',buildTitle:'Construction takes time and pauses production across the farm.',build:'Build',upgrade:'Upgrade',constructing:'Building',deliver:'Deliver order',need:'Not enough goods',complete:'Construction complete',weather:'Weather',day:'Day',night:'Night',auto:'Real time',sunny:'Sunny',rainy:'Rain',snowy:'Snow',zoom:'Interface size',language:'Language',panHint:'Drag open ground to pan; drag a field to clear the roads.',saved:'Progress saved',cash:'Not enough coins',noPlot:'This field is still locked',noSeed:'Choose an unlocked seed first',confirm:'Clear local save',clearWarn:'Clear the farm saved on this computer?',expandLevel:'Farm level required',readyAfter:'ready in',minutes:'min',hours:'hr',worker:'Builder',pet:'Dango',moveSaved:'Field moved.',moveBlocked:'There is no room here; avoid paths and buildings.',time:'Time'}};
const EXPAND_COUNTS=[12,24,36,45,54,63,72,81],EXPAND_COSTS=[500,1800,3000,4500,6500,9000,12000,0],EXPAND_LEVELS=[2,5,7,9,11,13,15,20];
const now=()=>Date.now()/1000;
function fresh(){const t=now();return{version:'1.0',lang:'zh',coins:180,xp:0,land:0,seed:'wheat',weather:'auto',zoom:100,lighting:'auto',plots:Array.from({length:12},(_,i)=>({crop:i<4?'wheat':'',planted:t-120,ready:i===0?t-1:t+12+i*7,watered:false,x:30+(i%9)*52,y:80+Math.floor(i/9)*46})),inventory:{wheat:6},buildings:{home:1,mill:1},construction:{},queue:[],animals:[],layout:{},orders:0,order:[{crop:'wheat',qty:4,reward:28,xp:5},{crop:'wheat',qty:6,reward:42,xp:7},{crop:'wheat',qty:8,reward:56,xp:9}],lastSave:t};}
function load(){try{const v=JSON.parse(localStorage.getItem(SAVE));if(v&&Array.isArray(v.plots)&&v.plots.length>=12&&v.plots.length<=81){const n={...fresh(),...v};n.plots=n.plots.slice(0,81);if(!n.inventory)n.inventory={};if(!n.buildings)n.buildings={home:1,mill:1};if(!n.construction)n.construction={};if(!Array.isArray(n.queue))n.queue=[];return n;}}catch(e){}return fresh();}
let s=load(),panel='',notice='',noticeUntil=0,lastUI=0,lastClock=0,view={x:0,y:0,zoom:s.zoom/100},pointer=null,drag=null,frame=0,weatherDrops=Array.from({length:70},(_,i)=>({x:(i*173+37)%1920,y:(i*91+11)%1200,len:3+i%5,speed:300+i%140})),birds=Array.from({length:5},(_,i)=>({x:-650+i*245,y:-230+i%3*27,speed:12+i%6,phase:i*1.7})),pollinators=Array.from({length:12},(_,i)=>({type:i%3?'butterfly':'bee',x:-700+(i*139)%1400,y:110+(i*73)%510,tx:null,ty:null,phase:i*1.31}));
const t=k=>WORD[s.lang][k]||k,crop=id=>CROPS.find(c=>c.id===id),level=()=>{let n=1;while(n<20&&s.xp>=((n-1)*45+(n-1)*(n-1)*35))n++;return n;},xpNext=()=>level()>=20?0:level()*45+level()*level()*35;
function fmt(n){if(n>=3600)return Math.ceil(n/3600)+t('hours');if(n>=60)return Math.ceil(n/60)+t('minutes');return Math.ceil(n)+'s';}
function toast(text){notice=text;noticeUntil=Date.now()+2400;$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>{if(Date.now()>=noticeUntil)$('toast').classList.remove('show');},2500);}
function save(){s.lastSave=now();try{localStorage.setItem(SAVE,JSON.stringify(s));}catch(e){} }
function gain(coins,xp){s.coins+=coins;s.xp+=xp;}
function addItem(id,n){s.inventory[id]=(s.inventory[id]||0)+n;if(s.inventory[id]<=0)delete s.inventory[id];}
function isPaused(){return Object.keys(s.construction).length>0;}
function productionRemaining(ready){if(isPaused())return Math.max(0,ready-Math.max(now(),s.pauseUntil||now()));return Math.max(0,ready-now());}
function doPlot(i){const p=s.plots[i];if(!p){toast(t('noPlot'));return;}if(!p.crop){if(isPaused()){toast(t('paused'));return;}const c=crop(s.seed);if(!c||c.level>level()){toast(t('noSeed'));return;}if(s.coins<c.cost){toast(t('cash'));return;}s.coins-=c.cost;p.crop=c.id;p.planted=now();p.ready=now()+c.seconds;p.watered=false;toast((s.lang==='en'?'Planted ':'种下')+c[s.lang]);}else if(p.ready<=now()){const c=crop(p.crop);addItem(p.crop,3);p.crop='';p.watered=false;gain(0,c.xp);toast(c[s.lang]+' +3');}else if(!isPaused()&&!p.watered){p.watered=true;p.ready=now()+(p.ready-now())*.8;toast(s.lang==='en'?'Watered · 20% faster':'浇水完成 · 时间缩短 20%');}else if(isPaused())toast(t('paused'));save();renderUI();}
function plantAll(){if(isPaused()){toast(t('paused'));return;}const c=crop(s.seed);let n=0;if(!c||c.level>level())return toast(t('noSeed'));for(const p of s.plots)if(!p.crop&&s.coins>=c.cost){s.coins-=c.cost;p.crop=c.id;p.planted=now();p.ready=now()+c.seconds;p.watered=false;n++;}toast(n?(s.lang==='en'?'Planted '+n+' fields':'已播种 '+n+' 块田')+' · '+c[s.lang]:t('nothing'));save();renderUI();}
function harvestAll(){let n=0;for(const p of s.plots)if(p.crop&&p.ready<=now()){addItem(p.crop,3);gain(0,crop(p.crop).xp);p.crop='';p.watered=false;n++;}toast(n?(s.lang==='en'?'Harvested '+n+' fields':'收获 '+n+' 块田'):t('nothing'));save();renderUI();}
function expand(){const idx=s.land;if(idx>=7)return toast(s.lang==='en'?'All 81 fields are open.':'81 块田已全部开垦。');if(level()<EXPAND_LEVELS[idx])return toast(t('expandLevel')+' Lv.'+EXPAND_LEVELS[idx]);if(s.coins<EXPAND_COSTS[idx])return toast(t('cash'));const before=EXPAND_COUNTS[idx],after=EXPAND_COUNTS[idx+1];s.coins-=EXPAND_COSTS[idx];s.land++;for(let i=before;i<after;i++)s.plots.push({crop:'',planted:0,ready:0,watered:false,x:30+(i%9)*52,y:80+Math.floor(i/9)*46});gain(0,20);toast(s.lang==='en'?'New fields opened.':'新的田地已经开垦。');save();renderUI();}
function sell(id,all=false){const count=s.inventory[id]||0;if(!count)return;const qty=all?count:1,price=(crop(id)?.price||({flour:8,bread:22,milk:12,egg:8,wool:16,honey:20}[id]||2))*qty;addItem(id,-qty);gain(price,0);toast((s.lang==='en'?'Sold ':'售出 ')+qty+' × '+(crop(id)?.[s.lang]||id)+' · +'+price+' G');save();renderUI();}
function makeFlour(){if(isPaused())return toast(t('paused'));if(s.coins<0)return;if((s.inventory.wheat||0)<2)return toast(t('need'));s.inventory.wheat-=2;s.queue.push({id:'flour',ready:now()+180});toast(s.lang==='en'?'Flour queued.':'面粉已加入工坊队列。');save();renderUI();}
function animalAction(i){const a=s.animals[i];if(!a||a.type==='cat')return;const products={chicken:['egg',2,900],cow:['milk',1,1800],sheep:['wool',1,2400],bee:['honey',1,2100]},labels={egg:['鸡蛋','Eggs'],milk:['牛奶','Milk'],wool:['羊毛','Wool'],honey:['蜂蜜','Honey']};const [product,amount,seconds]=products[a.type]||['egg',1,900];if(isPaused())return toast(t('paused'));if(a.fed){if(a.ready>now())return toast((s.lang==='en'?'Ready in ':'还需 ')+fmt(a.ready-now()));addItem(product,amount);gain(0,2);a.fed=false;a.ready=0;toast((s.lang==='en'?'Collected ':'收集 ')+amount+' × '+labels[product][s.lang==='en'?1:0]+'.');}else{if((s.inventory.wheat||0)<1)return toast(s.lang==='en'?'Need wheat to feed this animal.':'需要 1 份小麦喂养动物。');addItem('wheat',-1);a.fed=true;a.ready=now()+seconds;toast(s.lang==='en'?'Fed. Come back when the product is ready.':'已喂食，产品成熟后回来收取。');}save();renderUI();}
+function startBuild(id){if(s.construction[id])return;if(isPaused())return toast(t('paused'));const has=s.buildings[id];const cost=has?Math.max(320,({mill:0,bakery:320,coop:280,barn:1200,dairy:1800,loom:3000,sugar:4200,preserves:5200}[id]||320))*(has>=2?5:2):({bakery:320,coop:280,barn:1200,dairy:1800,loom:3000,sugar:4200,preserves:5200}[id]||600);if(s.coins<cost)return toast(t('cash'));const minutes=id==='barn'?120:id==='dairy'?180:id==='loom'?240:id==='sugar'?360:id==='preserves'?480:20;s.coins-=cost;s.construction[id]={start:now(),ready:now()+minutes*60,level:(has||0)+1};s.pauseUntil=Math.max(...Object.values(s.construction).map(c=>c.ready));for(const j of s.queue)j.ready=Math.max(j.ready,s.pauseUntil);for(const p of s.plots)if(p.crop&&p.ready>now())p.ready+=s.pauseUntil-now();for(const a of s.animals)if(a.fed&&a.ready>now())a.ready+=s.pauseUntil-now();toast(t('constructing')+' · '+fmt(minutes*60));save();renderUI();}

function fieldList(){return s.plots;}
function drawAnimal(a,dt){if(!a.tx||Math.hypot(a.tx-a.x,a.ty-a.y)<5||Math.random()<.006){a.tx=a.x+(Math.random()-.5)*170;a.ty=a.y+(Math.random()-.5)*100;}const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy)||1,step=Math.min(d,(a.type==='bee'?48:a.type==='chicken'?25:16)*dt);a.x+=dx/d*step;a.y+=dy/d*step;if(a.type==='bee'){ctx.fillStyle='#f2cb58';ctx.fillRect(a.x-5,a.y-5,11,8);ctx.fillStyle='#544a38';ctx.fillRect(a.x,a.y-5,2,8);ctx.fillStyle='#f7f1cc';ctx.fillRect(a.x-4,a.y-9,4,3);ctx.fillRect(a.x+2,a.y-10,4,3);return;}if(a.type==='chicken'){ctx.fillStyle='#69513f';ctx.fillRect(a.x-8,a.y-3,14,9);ctx.fillStyle='#f1e2b2';ctx.fillRect(a.x-7,a.y-8,13,9);ctx.fillRect(a.x+2,a.y-14,7,10);ctx.fillStyle='#cd6853';ctx.fillRect(a.x+4,a.y-17,5,4);ctx.fillStyle='#e7b357';ctx.fillRect(a.x+8,a.y-11,4,2);ctx.fillStyle='#424338';ctx.fillRect(a.x+5,a.y-12,2,2);return;}if(a.type==='cow'){ctx.fillStyle='#695c4a';ctx.fillRect(a.x-15,a.y-15,30,20);ctx.fillStyle='#eee4c7';ctx.fillRect(a.x-13,a.y-14,26,16);ctx.fillStyle='#53655a';ctx.fillRect(a.x-7,a.y-13,8,7);ctx.fillRect(a.x+3,a.y-7,7,7);ctx.fillRect(a.x+9,a.y-19,13,14);ctx.fillStyle='#eedec0';ctx.fillRect(a.x+10,a.y-20,11,12);ctx.fillStyle='#bf8d7d';ctx.fillRect(a.x+11,a.y-11,11,4);ctx.fillStyle='#51463c';ctx.fillRect(a.x-9,a.y+2,4,7);ctx.fillRect(a.x+7,a.y+2,4,7);return;}ctx.fillStyle='#755747';ctx.fillRect(a.x-9,a.y-8,19,14);ctx.fillStyle='#cc9668';ctx.fillRect(a.x-7,a.y-8,16,12);ctx.fillStyle='#634c41';ctx.fillRect(a.x+3,a.y-16,11,12);ctx.fillStyle='#e4b984';ctx.fillRect(a.x+4,a.y-15,9,10);ctx.fillStyle='#473d37';ctx.fillRect(a.x+10,a.y-12,2,2);ctx.fillRect(a.x-6,a.y+4,4,5);ctx.fillRect(a.x+5,a.y+4,4,5);}
function drawPollinator(a,dt,time){if(!a.tx||Math.hypot(a.tx-a.x,a.ty-a.y)<6||Math.random()<.004){a.tx=-850+Math.random()*1700;a.ty=100+Math.random()*540;}const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy)||1,step=Math.min(d,(a.type==='bee'?34:15)*dt);a.x+=dx/d*step;a.y+=dy/d*step;if(a.type==='bee'){ctx.fillStyle='rgba(250,244,216,.8)';ctx.fillRect(a.x-3,a.y-8,5,4);ctx.fillRect(a.x+2,a.y-7,5,4);ctx.fillStyle='#e6bb4c';ctx.fillRect(a.x-4,a.y-3,10,6);ctx.fillStyle='#594a39';ctx.fillRect(a.x,a.y-3,2,6);}else{const flap=Math.sin(time*12+a.phase)>0?2:0;ctx.fillStyle='rgba(246,222,180,.78)';ctx.fillRect(a.x-7,a.y-4-flap,6,5);ctx.fillRect(a.x+2,a.y-4-flap,6,5);ctx.fillStyle=a.phase%2?'#d98b9d':'#bab1d5';ctx.fillRect(a.x-4,a.y-2,8,7);ctx.fillStyle='#65754a';ctx.fillRect(a.x-1,a.y-1,2,7);}}
+function ensureAnimals(){if(!s.animals.some(a=>a.type==='cat'))s.animals.unshift({type:'cat',x:-370,y:265});for(const a of s.animals){a.x??=rand(s.animals.indexOf(a)+1)*600-300;a.y??=180+rand(s.animals.indexOf(a)+9)*260;}}

const worldCache=document.createElement('canvas');worldCache.width=3400;worldCache.height=1900;let worldCacheKey='';
function rebuildWorldCache(){const main=ctx;ctx=worldCache.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.save();ctx.translate(1700,950);const grad=ctx.createLinearGradient(0,-600,0,300);grad.addColorStop(0,'#d3e3d2');grad.addColorStop(.52,'#a9c4a2');grad.addColorStop(1,'#92ae72');ctx.fillStyle=grad;ctx.fillRect(-1700,-950,3400,1900);
ctx.fillStyle='#7f9e79';ctx.beginPath();ctx.moveTo(-1700,-250);for(let x=-1700;x<=1700;x+=80)ctx.lineTo(x,-310+Math.sin(x*.008)*46+Math.cos(x*.019)*21);ctx.lineTo(1700,120);ctx.lineTo(-1700,120);ctx.closePath();ctx.fill();ctx.fillStyle='#6f8d68';ctx.beginPath();ctx.moveTo(-1700,-180);for(let x=-1700;x<=1700;x+=60)ctx.lineTo(x,-205+Math.sin(x*.012+1)*34+Math.cos(x*.025)*17);ctx.lineTo(1700,150);ctx.lineTo(-1700,150);ctx.closePath();ctx.fill();ctx.fillStyle='#8eaa6c';ctx.fillRect(-1700,30,3400,1000);
for(let i=0;i<780;i++){const x=-1600+rand(i+1)*3200,y=70+rand(i+71)*910;ctx.fillStyle=i%3===0?'#9bb577':i%3===1?'#7f9d62':'#89a76c';ctx.fillRect(x,y,2+rand(i+9)*3,1);if(i%37===0){ctx.fillStyle=['#f2dba1','#d8939a','#c9c0df'][i%3];ctx.fillRect(x+3,y-2,3,2);}}
ctx.fillStyle='#b49f77';ctx.fillRect(-540,238,1170,18);ctx.fillStyle='#d3c49a';ctx.fillRect(-540,239,1170,11);for(let x=-520;x<620;x+=35){ctx.fillStyle='#e0d2a8';ctx.fillRect(x,241,9,2);}
for(let i=0;i<38;i++){const x=-1350+i*73,y=-250+Math.sin(i*1.9)*80;drawPine(x,y);if(i%3===0)drawTree(x+30,y+68,i%2===0,i%4===0);}for(let i=0;i<22;i++){const x=-1300+i*121,y=535+(i%4)*47;drawTree(x,y,i%2===0,i%3===0);}
for(let c=0;c<18;c++){const x=-850+c*98,y=475+Math.sin(c*1.7)*56;for(let j=0;j<7;j++){const px=x+(j%4)*8,py=y+Math.floor(j/4)*9+(j%2)*2;ctx.fillStyle=['#f1d38e','#d991a1','#c5b8df','#f4eee0'][j%4];ctx.fillRect(px,py,4,3);ctx.fillStyle='#638554';ctx.fillRect(px+1,py+3,2,5);}}
const buildings=[['home',-460,134],['mill',-245,122],['bakery',-43,144],['coop',-300,340],['barn',-66,354],['dairy',166,118],['loom',387,133],['sugar',608,121],['preserves',825,155]];for(const [id,x,y] of buildings){if(!s.buildings[id]&&!s.construction[id]&&id!=='home')continue;const p=s.layout[id]||{x,y};drawHouse(p.x,p.y,id==='home'?'home':id==='mill'?'mill':id==='bakery'?'bakery':'home');}
ctx.restore();ctx=main;}
function drawMillFan(x,y,time){ctx.save();ctx.translate(x,y-64);ctx.rotate(time/5);for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.fillStyle='#eee0b8';ctx.fillRect(2,-3,47,7);ctx.fillStyle='#9b7c52';ctx.fillRect(40,-2,8,5);}ctx.restore();}
function drawWorld(dt){const w=innerWidth,h=innerHeight,z=view.zoom;ctx.fillStyle='#8aa56c';ctx.fillRect(0,0,w,h);const cacheKey=JSON.stringify([s.buildings,s.construction,s.layout]);if(cacheKey!==worldCacheKey){rebuildWorldCache();worldCacheKey=cacheKey;}ctx.save();ctx.translate(w/2,h/2);ctx.scale(z,z);ctx.translate(-view.x,-view.y);ctx.drawImage(worldCache,-1700,-950);
for(const p of s.plots)drawField(p);ensureAnimals();const nowMs=performance.now()/1000;for(const a of s.animals){drawAnimal(a,Math.min(.08,dt));if(a.type!=='cat'&&a.fed&&a.ready<=now()){ctx.fillStyle='#fff0c5';ctx.fillRect(a.x+13,a.y-28,9,9);ctx.fillStyle='#8e9c65';ctx.fillRect(a.x+16,a.y-26,3,5);}}for(const a of pollinators)drawPollinator(a,Math.min(.08,dt),nowMs);for(let i=0;i<5;i++){const b=birds[i];b.x+=b.speed*dt;if(b.x>view.x+w/z/2+80)b.x=view.x-w/z/2-80;const by=b.y+Math.sin(nowMs*1.7+b.phase)*8;ctx.strokeStyle='#3f5146';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,by);ctx.lineTo(b.x+7,by+3);ctx.lineTo(b.x+14,by);ctx.stroke();}
const mill=s.layout.mill||{x:-245,y:122};if(s.buildings.mill||s.construction.mill)drawMillFan(mill.x,mill.y,nowMs);if(s.lighting==='night'||(s.lighting==='auto'&&(new Date().getHours()<6||new Date().getHours()>18))){ctx.fillStyle='rgba(30,47,67,.24)';ctx.fillRect(view.x-w/z/2,view.y-h/z/2,w/z,h/z);for(const [id,x,y] of [['home',-460,134],['mill',-245,122],['bakery',-43,144],['coop',-300,340],['barn',-66,354],['dairy',166,118],['loom',387,133],['sugar',608,121],['preserves',825,155]])if(s.buildings[id]){const p=s.layout[id]||{x,y};ctx.fillStyle='rgba(255,223,145,.9)';ctx.fillRect(p.x-29,p.y-43,7,7);ctx.fillRect(p.x+20,p.y-43,7,7);}}ctx.restore();
if(s.weather==='rain'||(s.weather==='auto'&&new Date().getDay()===2)){ctx.fillStyle='rgba(37,65,83,.055)';ctx.fillRect(0,0,w,h);ctx.strokeStyle='rgba(208,229,224,.72)';ctx.lineWidth=1.4;ctx.beginPath();for(const d of weatherDrops){const x=(d.x+nowMs*48)%w,y=(d.y+nowMs*d.speed)%h;ctx.moveTo(x,y);ctx.lineTo(x-3,y+d.len);}ctx.stroke();ctx.fillStyle='rgba(212,235,228,.65)';for(let i=0;i<12;i++){const x=(i*193+Math.floor(nowMs*29))%w,y=(i*107+Math.floor(nowMs*123))%h;if(y>h*.5)ctx.fillRect(x-2,y,5,1);}}if(s.weather==='snow'){ctx.fillStyle='rgba(245,245,228,.83)';for(let i=0;i<44;i++){const x=(i*137+Math.sin(nowMs+i)*19+nowMs*9)%w,y=(i*71+nowMs*23)%h;ctx.fillRect(x,y,3,3);}}}
function loop(time){if(lastFrame&&time-lastFrame<32){frame=requestAnimationFrame(loop);return;}const dt=lastFrame?Math.min(.08,(time-lastFrame)/1000):0;lastFrame=time;tick();drawWorld(dt);frame=requestAnimationFrame(loop);}let lastFrame=0;renderUI();requestAnimationFrame(loop);setInterval(save,12000);

function screenWorld(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-innerWidth/2)/view.zoom+view.x,y:(e.clientY-r.top-innerHeight/2)/view.zoom+view.y};}
function plotAt(p){return s.plots.findIndex(o=>p.x>=o.x-3&&p.x<=o.x+45&&p.y>=o.y-5&&p.y<=o.y+36);}
function animalAt(p){return s.animals.findIndex(a=>a.type!=='cat'&&Math.hypot(a.x-p.x,a.y-p.y)<27);}
+function buildingAt(p){for(const id of ['preserves','sugar','loom','dairy','barn','coop','bakery','mill','home']){const base={home:[-460,134],mill:[-245,122],bakery:[-43,144],coop:[-300,340],barn:[-66,354],dairy:[166,118],loom:[387,133],sugar:[608,121],preserves:[825,155]}[id];if(id!=='home'&&!s.buildings[id]&&!s.construction[id])continue;const q=s.layout[id]||{x:base[0],y:base[1]};if(p.x>=q.x-56&&p.x<=q.x+56&&p.y>=q.y-100&&p.y<=q.y+5)return id;}return '';}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=screenWorld(e),i=plotAt(p),building=buildingAt(p);drag={sx:e.clientX,sy:e.clientY,lastX:e.clientX,lastY:e.clientY,plot:i,animal:animalAt(p),building,wx:p.x,wy:p.y,moved:false};canvas.classList.add('dragging');});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.lastX,dy=e.clientY-drag.lastY;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6)drag.moved=true;if(drag.moved){if(drag.animal>=0){drag.lastX=e.clientX;drag.lastY=e.clientY;return;}if(drag.plot>=0){s.plots[drag.plot].x+=dx/view.zoom;s.plots[drag.plot].y+=dy/view.zoom;}else if(drag.building){const id=drag.building,old=s.layout[id]||{x:({home:-460,mill:-245,bakery:-43,coop:-300,barn:-66,dairy:166,loom:387,sugar:608,preserves:825}[id]),y:({home:134,mill:122,bakery:144,coop:340,barn:354,dairy:118,loom:133,sugar:121,preserves:155}[id])};s.layout[id]={x:old.x+dx/view.zoom,y:old.y+dy/view.zoom};}else{view.x-=dx/view.zoom;view.y-=dy/view.zoom;view.x=Math.max(-1250,Math.min(1250,view.x));view.y=Math.max(-600,Math.min(600,view.y));}}drag.lastX=e.clientX;drag.lastY=e.clientY;});
canvas.addEventListener('pointerup',e=>{if(!drag)return;const end=screenWorld(e);if(drag.moved){save();if(drag.plot>=0)toast(t('moveSaved'));}else if(drag.plot>=0)doPlot(drag.plot);else if(drag.animal>=0)animalAction(drag.animal);else{const id=buildingAt(end);if(id){panel=id==='coop'||id==='barn'?'build':'workshop';renderUI();}}drag=null;canvas.classList.remove('dragging');});canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('dragging');});canvas.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();s.zoom=Math.max(50,Math.min(150,s.zoom+(e.deltaY>0?-5:5)));view.zoom=s.zoom/100;save();}},{passive:false});
</script></body></html>
