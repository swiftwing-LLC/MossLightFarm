 if(panel==='build'){const en=state.language==='en';html='<p class="hint">'+(en?'Builders ':'施工队 ')+state.busyBuilders+'/'+state.builders+' · '+(en?'Construction continues while away.':'离线也会继续施工。')+'</p>'+btn(t('land')+' · '+state.expandCost+' G','expand','',!state.canExpand,'wide')+state.buildings.map(b=>'<div class="row"><img class="building-picture" alt="" src="building/'+b.id+'?tier='+b.tier+'&busy='+b.busy+'"><div class="detail"><div class="name">'+esc(b.name)+' <span class="level-dots">'+('◆'.repeat(b.tier))+('◇'.repeat(3-b.tier))+'</span></div><div class="sub">'+(b.busy?'<span class="construction-time">'+(en?'Building Lv.':'施工至 Lv.')+b.target+' · '+seconds(b.seconds)+'</span>':b.tier>=3?(en?'Fully upgraded':'已满级'):(b.owned?'Lv.'+b.tier+' → '+b.target:'Lv.'+b.level+' '+(en?'unlock':'解锁'))+'<br>'+b.cost+' G · '+seconds(b.seconds)+(b.queued?'<br>'+(en?'Finish production first':'请先完成生产队列'):''))+'</div></div>'+btn(b.busy?(en?'In progress':'施工中'):b.tier>=3?(en?'Max':'满级'):t(b.owned?'upgrade':'buy'),'build',b.id,!b.can)+'</div>').join('');}
 if(panel==='maps'){const en=state.language==='en';html='<p class="hint">'+(en?'Drag empty ground to pan; drag objects to move them. Hold Shift to select desktop icons.':'直接拖空地移动地图，拖物品调整位置。按住 Shift 可框选桌面图标。')+'</p>'+btn(en?'Drag to explore':'拖动浏览地图','navigate','toggle',false,'wide')+btn(en?'Return to farmhouse':'回到农舍','navigate','home',false,'wide')+state.maps.map(m=>'<div class="map-card"><img alt="" src="map/'+m.id+'"><div class="name">'+esc(m.name)+'</div><p class="hint">'+esc(m.description)+'</p>'+btn(m.id===state.map?(en?'Current map':'当前地图'):m.owned?(en?'Switch':'切换'):(en?'Unlock · ':'解锁 · ')+m.cost+' G','map',m.id,m.id===state.map||(!m.owned&&state.coins<m.cost),'wide')+'</div>').join('');}
 if(panel==='decor')html='<p class="hint">'+t('decorHint')+'</p><div class="grid">'+state.decor.map(d=>'<button class="seed" data-action="decor" data-id="'+d.id+'" '+(state.coins<d.cost?'disabled':'')+'>'+img('decor:'+d.id)+esc(d.name)+'<small>'+d.cost+' G</small></button>').join('')+'</div>'+(state.edit?btn(t('finish'),'edit','','','wide'): '');
 if(panel==='settings')html='<div class="section">'+t('language')+'</div><div class="toggle">'+btn('中文','language','zh-CN',false,state.language==='zh-CN'?'active':'')+btn('English','language','en',false,state.language==='en'?'active':'')+'</div><div class="section">'+t('lighting')+'</div><div class="toggle">'+[['白天','day'],['夜晚','night'],['跟随时间','auto']].map(([id,key])=>btn(t(key),'light',id,false,state.lighting===id?'active':'')).join('')+'</div>'+btn(t('call'),'call','','','wide')+'<p class="hint">'+t('saved')+' · '+esc(state.shortcut)+'</p>';
 if(panel==='settings'){const en=state.language==='en';html='<div class="section">'+(en?'Start with Windows':'开机自动启动')+'</div><div class="toggle">'+btn(en?'On':'开启','startup','on',!state.startupAllowed,state.startup?'active':'')+btn(en?'Off':'关闭','startup','off',!state.startupAllowed,!state.startup?'active':'')+'</div><p class="hint">'+(en?'Starts your independent desktop farm after you sign in.':'登录 Windows 后自动启动桌面农场，无需 Wallpaper Engine。')+'</p>'+btn(en?'Reconnect wallpaper':'重新连接壁纸','repair','','','wide')+'<div class="section">'+(en?'Weather':'天气')+'</div><div class="toggle">'+[['自动',en?'Auto':'自动'],['晴天',en?'Clear':'晴天'],['雨天',en?'Rain':'雨天'],['雪天',en?'Snow':'雪天']].map(([id,label])=>btn(label,'weather',id,false,state.weather===id?'active':'')).join('')+'</div><div class="section">'+(en?'Interface size':'界面大小')+'</div><div class="toggle">'+[50,75,85,100,125,150].map(z=>btn(z===100?(en?'Auto':'自适应'):z+'%','zoom',z,false,state.zoom===z?'active':'')).join('')+'</div>'+html;}

 if(panel==='settings'){const en=state.language==='en';html+='<div class="section">'+(en?'Power saving':'省电模式')+'</div><div class="toggle">'+btn(en?'On':'开启','quiet','on',false,state.quiet?'active':'')+btn(en?'Off':'关闭','quiet','off',false,!state.quiet?'active':'')+'</div><p class="hint">'+(en?'Slower ambient animation; crops and production keep their real-time schedules.':'降低背景动画刷新频率，作物与加工照常计时。')+'</p>'; }

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.panel){openPanel(b.dataset.panel);return;}if(b.dataset.action){const a=b.dataset.action;command(a,b.dataset.id||'');if(a==='navigate'&&b.dataset.id==='toggle'){panel='';render();}if(a==='decor'){panel='';render();}if(a==='edit'){panel='';render();}}});
$('close').onclick=()=>{panel='';render();};$('settingsQuick').onclick=()=>openPanel('settings');
canvas.addEventListener('mousedown',e=>{if(e.button===0){dragHeld=true;send('down',e);e.preventDefault();}});window.addEventListener('mouseup',e=>{if(e.button===0&&dragHeld){dragHeld=false;send('up',e);}});canvas.addEventListener('mousemove',e=>{if(performance.now()-moveAt>32){moveAt=performance.now();send('move',e);}});canvas.addEventListener('contextmenu',e=>{e.preventDefault();send('cancel',e);});window.addEventListener('blur',()=>{if(window.nativeGameHeld)return;dragHeld=false;send('cancel');});window.addEventListener('keydown',e=>{if(e.code==='Escape'){panel='';send('cancel');render();}if(e.code==='Space'&&e.target===document.body){command('edit');e.preventDefault();}});
async function refresh(){try{const r=await fetch('state');if(!r.ok)throw Error();state=await r.json();if(state.revision!==revision){revision=state.revision;panel=state.panel;}render();}catch(e){$('status').style.display='block';$('status').textContent='Mosslight · Reconnecting…';}}
async function poll(){await refresh();setTimeout(poll,1000)}poll();
const frameImage=new Image();let frameTimer,lastFrameAt=Date.now();
function animate(){clearTimeout(frameTimer);frameImage.src=new URL('frame?n='+frame+'&t='+Date.now(),document.baseURI).href;}
frameImage.onload=()=>{ctx.imageSmoothingEnabled=false;ctx.drawImage(frameImage,0,0,960,540);lastFrameAt=Date.now();$('status').style.display='none';if(++frame%10===1)fetch('ack',{method:'POST',body:String(frame)}).catch(()=>{});frameTimer=setTimeout(animate,dragHeld?33:state?.quiet?240:80);};
frameImage.onerror=()=>{$('status').style.display='block';$('status').textContent='Mosslight · Reconnecting…';frameTimer=setTimeout(animate,1500);};
let nativeTarget=null;
window.nativePointer=d=>{const x=d.x*innerWidth,y=d.y*innerHeight,el=document.elementFromPoint(x,y),event={clientX:x,clientY:y,button:0,bubbles:true};if(d.phase==='down'){nativeTarget=el?.closest('button');(el||canvas).dispatchEvent(new MouseEvent('mousedown',event));}else if(d.phase==='move')canvas.dispatchEvent(new MouseEvent('mousemove',{...event,buttons:1}));else if(d.phase==='up'){window.dispatchEvent(new MouseEvent('mouseup',event));if(nativeTarget&&nativeTarget===el?.closest('button'))nativeTarget.click();nativeTarget=null;}else if(d.phase==='cancel'){dragHeld=false;send('cancel');}else if(d.phase==='wheel'){const box=el?.closest('#content');if(box)box.scrollTop-=d.delta;}};
setInterval(()=>{if(window.chrome?.webview){const rects=['resources','dock','drawer','mode','compass'].map(id=>$(id)).filter(e=>getComputedStyle(e).display!=='none').map(e=>{const r=e.getBoundingClientRect();return [r.x/innerWidth,r.y/innerHeight,r.width/innerWidth,r.height/innerHeight]});window.chrome.webview.postMessage(rects);}},250);
setInterval(()=>{if(Date.now()-lastFrameAt>8000){lastFrameAt=Date.now();animate();}},4000);animate();
