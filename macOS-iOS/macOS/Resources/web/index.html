<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light;--paper:#f5efd9;--ink:#40513f;--muted:#7a8067;--edge:#b7bb96;--green:#597456}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fad69;color:var(--ink);font:14px 'Segoe UI','Microsoft YaHei UI',sans-serif;user-select:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--edge);background:#eee9d2;border-radius:5px;padding:7px 11px;white-space:nowrap}button:hover{background:#e1e6c8;border-color:#81946c}button:focus-visible{outline:2px solid #597456;outline-offset:2px}button:disabled{opacity:.5;cursor:default}button.active,.primary{background:var(--green);color:#fff8df;border-color:#4b6449}button.active:hover,.primary:hover{background:#66805f}.surface{background:rgba(245,239,217,.97);border:1px solid #929f79;box-shadow:0 3px 0 #526b4933,0 6px 18px #344f3520;border-radius:9px}
#resources{position:absolute;top:18px;right:18px;display:flex;align-items:center;gap:16px;padding:9px 14px;min-width:240px;height:49px}#money{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}.coin{display:inline-block;width:13px;height:13px;border:2px solid #ab813e;background:#e7c777;box-shadow:inset 2px 0 #fff1a8;margin-right:6px;vertical-align:-1px}.level{font-size:12px;color:var(--muted);min-width:95px}.bar{height:4px;background:#dddcc0;border-radius:2px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#789068}#resources button{padding:4px 7px;background:transparent;border:0}#dock{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;max-width:calc(100vw - 24px)}#dock button{border-color:transparent;background:transparent;padding:7px 12px;font-size:12px;min-height:37px}#dock button.active{background:#597456}#dock button:hover{background:#dce3c5;color:var(--ink)}.glyph{display:block;font-size:16px;line-height:19px;margin-bottom:3px}.separator{height:28px;width:1px;background:#d3d6b7;margin:0 4px}#drawer{position:absolute;right:18px;bottom:139px;width:336px;max-width:calc(100vw - 36px);max-height:calc(100vh - 224px);display:none;overflow:hidden}#drawer header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 9px;border-bottom:1px solid #dddfc6}h2{font-size:14px;margin:0;font-weight:650}#drawer header button{padding:2px 8px;background:transparent;border:0;font-size:18px}#content{overflow:auto;max-height:calc(100vh - 278px);padding:10px 12px;scrollbar-width:thin;scrollbar-color:#b3be98 transparent}.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e0e1c8}.row:last-child{border:0}.row img{width:36px;height:36px;image-rendering:pixelated;flex-shrink:0}.detail{flex:1;min-width:0}.name{font-weight:600;font-size:12px;margin-bottom:4px}.sub{color:var(--muted);font-size:12px;line-height:1.55}.row button{font-size:12px;padding:6px 9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.seed{white-space:normal;padding:7px 4px;min-height:85px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.seed img{width:32px;height:32px;image-rendering:pixelated}.seed small{font-size:11px;opacity:.8}.hint{font-size:12px;color:var(--muted);line-height:1.65;margin:2px 0 10px}.section{font-size:12px;color:var(--muted);margin:13px 0 5px;letter-spacing:.03em}.queue{font-size:12px;background:#e5e7cd;border-radius:4px;padding:7px 9px;margin-bottom:5px;display:flex;justify-content:space-between}.wide{width:100%;margin:5px 0}.toggle{display:flex;gap:6px;margin:7px 0 14px}.toggle button{flex:1;font-size:12px}#toast{position:absolute;top:77px;right:18px;max-width:330px;padding:9px 13px;font-size:12px;line-height:1.5;pointer-events:none;display:none}#status{position:absolute;top:80px;right:18px;font-size:12px;padding:9px 12px}#mode{position:absolute;bottom:128px;left:50%;transform:translateX(-50%);font-size:12px;padding:7px 12px;display:none;pointer-events:none}#selectedSeed{font-size:12px;display:flex;align-items:center;gap:4px;min-width:75px;padding:0 7px}#selectedSeed img{width:25px;height:25px;image-rendering:pixelated}#ready{font-size:11px;background:#e5c57b;color:#66502f;border-radius:6px;padding:1px 4px;margin-left:3px}#ready:empty{display:none}@media(max-width:700px){#dock{gap:0;bottom:52px}#dock button{padding:6px 8px}#selectedSeed{display:none}.separator{margin:0 2px}#drawer{bottom:126px}#resources{top:12px;right:12px}}
#hud{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}#hud>.surface{pointer-events:auto}#dock{flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(var(--hud-w) - 24px)}#drawer{bottom:var(--panel-bottom);max-width:calc(var(--hud-w) - 36px);max-height:var(--panel-height)}#content{max-height:calc(var(--panel-height) - 56px)}#mode{bottom:var(--panel-bottom);max-width:calc(var(--hud-w) - 30px);width:max-content;white-space:normal;text-align:center}#toast{max-width:calc(var(--hud-w) - 36px)}#hud.compact #selectedSeed,#hud.compact .separator{display:none}#hud.compact #dock button{padding:8px 10px;min-width:60px}#hud.compact #dock{gap:2px}#hud.compact #resources{right:12px;top:12px}.toggle{flex-wrap:wrap}.toggle button{min-width:58px}#dock button{min-height:51px}#drawer header button,#settingsQuick{min-width:30px;min-height:30px}
</style></head><body>
<canvas id="farm" width="960" height="540"></canvas>
<div id="hud">
<div id="resources" class="surface"><div><span class="coin"></span><span id="money">—</span></div><div class="level"><span id="level">Lv.1</span><div class="bar"><i id="xp"></i></div></div><button id="settingsQuick" title="设置 / Settings">⚙</button></div>
<div id="status" class="surface">Mosslight · Connecting…</div><div id="toast" class="surface" role="status"></div><div id="mode" class="surface"></div>
<div id="drawer" class="surface"><header><h2 id="title"></h2><button id="close" aria-label="Close">×</button></header><div id="content"></div></div>
<nav id="dock" class="surface" aria-label="Farm tools"></nav>
</div>
<script src="data.js"></script><script src="english.js"></script><script src="engine.js"></script><script src="desktop.js"></script><script>
const $=id=>document.getElementById(id),canvas=$('farm'),ctx=canvas.getContext('2d');let state=null,panel='',frame=0,chain=Promise.resolve(),moveAt=0,revision=0,dragHeld=false,lastNote='',commands=Promise.resolve();
const words={zh:{seeds:'种子',inventory:'仓库',workshop:'工坊',orders:'订单',build:'建造',decor:'布置',settings:'设置',harvest:'收获',sell:'售出 1',craft:'制作',deliver:'交付',buy:'建造',upgrade:'升级',coins:'金币',empty:'收获的商品会放在这里。',seedHint:'选好种子，再点击空田播种。',queue:'正在生产',recipes:'配方',idle:'工坊空闲',plant:'播种全部空田',finish:'完成布置',decorHint:'选择装饰后点击草地放置；右键取消。已有物品可直接拖动。',mode:'布置中 · 拖动物品调整位置',land:'扩建土地',language:'语言',lighting:'光照',day:'白天',night:'夜晚',auto:'随时间',call:'呼唤小伙伴',gift:'领取每日来信',goal:'小目标',claim:'领取奖励',missing:'待备齐',locked:'解锁',saved:'操作自动保存',choose:'选用'},en:{seeds:'Seeds',inventory:'Storage',workshop:'Workshop',orders:'Orders',build:'Build',decor:'Arrange',settings:'Settings',harvest:'Harvest',sell:'Sell 1',craft:'Make',deliver:'Deliver',buy:'Build',upgrade:'Upgrade',coins:'coins',empty:'Your harvest will appear here.',seedHint:'Choose a seed, then click an empty plot.',queue:'In production',recipes:'Recipes',idle:'Workshop idle',plant:'Plant all empty plots',finish:'Finish arranging',decorHint:'Choose a decoration, then click grass to place. Right-click cancels. Drag objects to move them.',mode:'Arranging · Drag objects to move',land:'Expand land',language:'Language',lighting:'Lighting',day:'Day',night:'Night',auto:'Real time',call:'Call companions',gift:'Claim daily letter',goal:'Small goal',claim:'Claim reward',missing:'Need items',locked:'Unlock',saved:'Progress saves automatically',choose:'Select'}};
const t=k=>(words[state?.language==='en'?'en':'zh'][k]||k),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seconds=n=>n>=3600?Math.ceil(n/3600)+'h':n>=60?Math.ceil(n/60)+'m':Math.ceil(n)+'s';
const img=id=>'<img alt="" src="sprites/'+(id.startsWith('decor:')?'decor-'+id.slice(6):'item-'+id)+'.png">';
function fitHud(){const scale=Math.min(Math.max(1.3,Math.min(2.4,Math.min(innerWidth/1100,innerHeight/700)))*(state?.zoom||100)/100,Math.max(1.3,innerHeight/450),innerWidth/320),w=innerWidth/scale,h=innerHeight/scale,hud=$('hud');hud.style.width=w+'px';hud.style.height=h+'px';hud.style.transform='scale('+scale+')';hud.style.setProperty('--hud-w',w+'px');hud.classList.toggle('compact',w<700);const bottom=innerWidth<700?52:60,space=bottom+$('dock').offsetHeight+12;hud.style.setProperty('--panel-bottom',space+'px');hud.style.setProperty('--panel-height',Math.max(90,h-space-80)+'px');}
window.addEventListener('resize',()=>{fitHud();requestAnimationFrame(fitHud)});fitHud();
function btn(label,action,id='',disabled=false,cls=''){return '<button class="'+cls+'" data-action="'+action+'" data-id="'+esc(id)+'" '+(disabled?'disabled':'')+'>'+esc(label)+'</button>'}
function send(phase,e){const r=canvas.getBoundingClientRect(),data={phase,x:e?(e.clientX-r.left)/r.width:0,y:e?(e.clientY-r.top)/r.height:0};chain=chain.catch(()=>{}).then(()=>fetch('input',{method:'POST',body:JSON.stringify(data)}));}
function command(action,id=''){commands=commands.catch(()=>{}).then(async()=>{try{await chain.catch(()=>{});const r=await fetch('command',{method:'POST',body:JSON.stringify({action,id:String(id)})});if(!r.ok)throw Error();await refresh();}catch(e){$('status').style.display='block';}});return commands;}
function openPanel(name){panel=panel===name?'':name;render();}
function render(){if(!state)return;document.documentElement.lang=state.language;const seed=state.crops.find(c=>c.id===state.seed);$('money').textContent=state.coins.toLocaleString();$('resources').title=t('coins')+' · '+t('saved');$('level').textContent='Lv.'+state.level+' · '+state.xp+'/'+(state.xpMax||'MAX');$('xp').style.width=(state.xpMax?Math.min(100,state.xp/state.xpMax*100):100)+'%';
 const buttons=[['seeds','♧'],['inventory','▤'],['workshop','⚒'],['orders','✉'],['build','⌂'],['decor','✥']];$('dock').innerHTML='<div id="selectedSeed">'+img(seed.id)+esc(seed.name)+'</div><div class="separator"></div>'+buttons.map(([key,symbol])=>'<button data-panel="'+key+'" class="'+(panel===key?'active':'')+'"><span class="glyph">'+symbol+'</span>'+t(key)+'</button>').join('')+'<div class="separator"></div><button data-action="harvest" '+(!state.ready?'disabled':'')+'><span class="glyph">⌁</span>'+t('harvest')+'<span id="ready">'+(state.ready||'')+'</span></button>';
 $('mode').style.display=state.edit?'block':'none';$('mode').style.pointerEvents='auto';$('mode').innerHTML=(state.pending?esc(state.pending)+' · '+(state.language==='en'?'Click grass to place':'点击草地放置'):t('mode'))+' '+btn(state.pending?(state.language==='en'?'Cancel':'取消'):t('finish'),state.pending?'cancel':'edit');$('toast').style.display=state.note?'block':'none';$('toast').textContent=state.note;
 $('drawer').style.display=panel?'block':'none';fitHud();if(!panel)return;$('title').textContent=t(panel);let html='';
 if(panel==='seeds')html='<p class="hint">'+t('seedHint')+'</p><div class="grid">'+state.crops.map(c=>'<button class="seed '+(c.id===state.seed?'active':'')+'" data-action="seed" data-id="'+c.id+'" '+(c.level>state.level?'disabled':'')+'>'+img(c.id)+'<span>'+esc(c.name)+'</span><small>'+(c.level>state.level?'Lv.'+c.level:c.cost+' G · '+seconds(c.seconds))+'</small></button>').join('')+'</div>'+btn(t('plant'),'plant','',!state.empty,'wide');
 if(panel==='inventory')html=state.inventory.length?state.inventory.map(i=>'<div class="row">'+img(i.id)+'<div class="detail"><div class="name">'+esc(i.name)+' ×'+i.count+'</div><div class="sub">'+i.price+' G / 1</div></div>'+btn(t('sell')+' · +'+i.price,'sell',i.id)+'</div>').join(''):'<p class="hint">'+t('empty')+'</p>';
 if(panel==='workshop')html='<div class="section">'+t('queue')+'</div>'+(state.jobs.length?state.jobs.map(j=>'<div class="queue"><span>'+esc(j.name)+'</span><span>'+seconds(j.seconds)+'</span></div>').join(''):'<p class="hint">'+t('idle')+'</p>')+'<div class="section">'+t('recipes')+'</div>'+state.recipes.map(r=>'<div class="row">'+img(r.id)+'<div class="detail"><div class="name">'+esc(r.name)+'</div><div class="sub">'+esc(r.ingredients)+'<br>'+esc(r.building)+' · '+seconds(r.seconds)+'</div></div>'+btn(t('craft'),'craft',r.id,!r.can)+'</div>').join('');
 if(panel==='orders')html='<div class="queue"><span>'+esc(state.guide)+'</span></div>'+(state.guideDone?btn(t('claim'),'guide','','','wide'):'')+state.orders.map(o=>'<div class="row"><div class="detail"><div class="name">'+esc(o.name)+'</div><div class="sub">'+esc(o.items)+'<br>+'+o.coins+' G · +'+o.xp+' XP</div></div>'+btn(t(o.can?'deliver':'missing'),'order',o.id,!o.can)+'</div>').join('')+btn(t('gift'),'daily','','','wide');
 if(panel==='build')html=btn(t('land')+' · '+state.expandCost+' G','expand','',!state.canExpand,'wide')+state.buildings.map(b=>'<div class="row"><div class="detail"><div class="name">'+esc(b.name)+'</div><div class="sub">'+(b.owned?t('upgrade'):'Lv.'+b.level)+' · '+b.cost+' G</div></div>'+btn(t(b.owned?'upgrade':'buy'),'build',b.id,!b.can)+'</div>').join('');
 if(panel==='decor')html='<p class="hint">'+t('decorHint')+'</p><div class="grid">'+state.decor.map(d=>'<button class="seed" data-action="decor" data-id="'+d.id+'" '+(state.coins<d.cost?'disabled':'')+'>'+img('decor:'+d.id)+esc(d.name)+'<small>'+d.cost+' G</small></button>').join('')+'</div>'+(state.edit?btn(t('finish'),'edit','','','wide'): '');
 if(panel==='settings')html='<div class="section">'+t('language')+'</div><div class="toggle">'+btn('中文','language','zh-CN',false,state.language==='zh-CN'?'active':'')+btn('English','language','en',false,state.language==='en'?'active':'')+'</div><div class="section">'+t('lighting')+'</div><div class="toggle">'+[['白天','day'],['夜晚','night'],['跟随时间','auto']].map(([id,key])=>btn(t(key),'light',id,false,state.lighting===id?'active':'')).join('')+'</div>'+btn(t('call'),'call','','','wide')+'<p class="hint">'+t('saved')+' · Mosslight · macOS</p>';
 if(panel==='settings'){const en=state.language==='en';html='<div class="section">'+(en?'Start at login':'开机自动启动')+'</div><div class="toggle">'+btn(en?'On':'开启','startup','on',!state.startupAllowed,state.startup?'active':'')+btn(en?'Off':'关闭','startup','off',!state.startupAllowed,!state.startup?'active':'')+'</div><p class="hint">'+(en?'Start after signing in to macOS. System approval may be required.':'登录 macOS 后自动启动；系统可能需要你在登录项中确认。')+'</p>'+btn(en?'Reconnect wallpaper':'重新连接壁纸','repair','','','wide')+'<div class="section">'+(en?'Weather':'天气')+'</div><div class="toggle">'+[['自动',en?'Auto':'自动'],['晴天',en?'Clear':'晴天'],['雨天',en?'Rain':'雨天'],['雪天',en?'Snow':'雪天']].map(([id,label])=>btn(label,'weather',id,false,state.weather===id?'active':'')).join('')+'</div><div class="section">'+(en?'Interface size':'界面大小')+'</div><div class="toggle">'+[50,75,85,100,125,150].map(z=>btn(z===100?(en?'Auto':'自适应'):z+'%','zoom',z,false,state.zoom===z?'active':'')).join('')+'</div>'+html;}
 if(panel==='settings'){const en=state.language==='en';html+='<div class="section">'+(en?'Power saving':'省电模式')+'</div><div class="toggle">'+btn(en?'On':'开启','quiet','on',false,state.quiet?'active':'')+btn(en?'Off':'关闭','quiet','off',false,!state.quiet?'active':'')+'</div><p class="hint">'+(en?'Slower ambient animation; crops and production keep their real-time schedules.':'降低背景动画刷新频率，作物与加工照常计时。')+'</p>'; }
 const scroll=$('content').scrollTop;if($('content').dataset.html!==html){$('content').innerHTML=html;$('content').dataset.html=html;$('content').scrollTop=scroll;}fitHud();
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.panel){openPanel(b.dataset.panel);return;}if(b.dataset.action){const a=b.dataset.action;command(a,b.dataset.id||'');if(a==='decor'){panel='';render();}if(a==='edit'){panel='';render();}}});
$('close').onclick=()=>{panel='';render();};$('settingsQuick').onclick=()=>openPanel('settings');
canvas.addEventListener('mousedown',e=>{if(e.button===0){dragHeld=true;send('down',e);e.preventDefault();}});window.addEventListener('mouseup',e=>{if(e.button===0&&dragHeld){dragHeld=false;send('up',e);}});canvas.addEventListener('mousemove',e=>{if(performance.now()-moveAt>32){moveAt=performance.now();send('move',e);}});canvas.addEventListener('contextmenu',e=>{e.preventDefault();send('cancel',e);});window.addEventListener('blur',()=>{if(window.nativeGameHeld)return;dragHeld=false;send('cancel');});window.addEventListener('keydown',e=>{if(e.code==='Escape'){panel='';send('cancel');render();}if(e.code==='Space'&&e.target===document.body){command('edit');e.preventDefault();}});
async function refresh(){try{const r=await fetch('state');if(!r.ok)throw Error();state=await r.json();if(state.revision!==revision){revision=state.revision;panel=state.panel;}render();}catch(e){$('status').style.display='block';$('status').textContent='Mosslight · Reconnecting…';}}
async function poll(){await refresh();setTimeout(poll,1000)}poll();
let nativeTarget=null;
window.nativePointer=d=>{const x=d.x*innerWidth,y=d.y*innerHeight,el=document.elementFromPoint(x,y),event={clientX:x,clientY:y,button:0,bubbles:true};if(d.phase==='down'){nativeTarget=el?.closest('button');(el||canvas).dispatchEvent(new MouseEvent('mousedown',event));}else if(d.phase==='move')canvas.dispatchEvent(new MouseEvent('mousemove',{...event,buttons:1}));else if(d.phase==='up'){window.dispatchEvent(new MouseEvent('mouseup',event));if(nativeTarget&&nativeTarget===el?.closest('button'))nativeTarget.click();nativeTarget=null;}else if(d.phase==='cancel'){dragHeld=false;send('cancel');}else if(d.phase==='wheel'){const box=el?.closest('#content');if(box)box.scrollTop-=d.delta;}};
setInterval(()=>{if(window.chrome?.webview){const rects=['resources','dock','drawer','mode'].map(id=>$(id)).filter(e=>getComputedStyle(e).display!=='none').map(e=>{const r=e.getBoundingClientRect();return [r.x/innerWidth,r.y/innerHeight,r.width/innerWidth,r.height/innerHeight]});window.chrome.webview.postMessage(rects);}},250);
</script></body></html>
